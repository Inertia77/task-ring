name: TaskRing CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

# Keep only the latest test run for a PR; avoids redundant browser downloads.
concurrency:
  group: taskring-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)
          node --check service-worker.js
          node --check tests/repo-integrity-check.js
          node --check tests/integrity-core.test.js

      - name: Install pinned dependencies
        run: npm ci

      - name: Reproduce static SDK bundle
        run: |
          npm run build
          git diff --exit-code -- assets/js/vendor

      - name: Data behavior tests
        run: node --test tests/*.test.js

      - name: Repository integrity
        run: node tests/repo-integrity-check.js

      - name: Whitespace check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD

  browser:
    # Pinned official image already includes Chromium/WebKit and system dependencies.
    # Matching @playwright/test avoids flaky on-runner browser downloads.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
