name: TaskRing CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)
          node --check service-worker.js
          node --check tests/repo-integrity-check.js
          node --check tests/integrity-core.test.js

      - name: Data behavior tests
        run: node --test tests/*.test.js

      - name: Repository integrity
        run: node tests/repo-integrity-check.js

      - name: Whitespace check
        run: git diff --check HEAD^
