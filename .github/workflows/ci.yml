name: TaskRing CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)
          node --check service-worker.js
          node --check tests/repo-integrity-check.js
          node --check tests/integrity-core.test.js

      - name: Install pinned dependencies
        run: npm ci

      - name: Reproduce static SDK bundle
        run: |
          npm run build
          git diff --exit-code -- assets/js/vendor

      - name: Data behavior tests
        run: node --test tests/*.test.js

      - name: Repository integrity
        run: node tests/repo-integrity-check.js

      - name: Whitespace check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD

  browser:
    # Playwright 1.58.2 supports Ubuntu 24.04; ubuntu-latest moved to 26.04,
    # where its Chromium/WebKit dependency installer exits before tests run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
